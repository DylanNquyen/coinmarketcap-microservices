version: '3.8'

services:
  # --------------------------------------------------
  # Database 1 cho Auth Service (auth-ms)
  # --------------------------------------------------
  auth-db:
    image: mysql:8.0
    container_name: auth_mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: auth_db
    ports:
      - '3306:3306'
    volumes:
      - auth_db_data:/var/lib/mysql

  # --------------------------------------------------
  # Database 2 cho Crypto Core Service (BE-ms)
  # --------------------------------------------------
  crypto-db:
    image: mysql:8.0
    container_name: crypto_mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: crypto_db
    ports:
      - '3307:3306' # Mở cổng 3307 bên ngoài máy host để tránh trùng với cổng 3306
    volumes:
      - crypto_db_data:/var/lib/mysql

  # --------------------------------------------------
  # Kong API Gateway
  # --------------------------------------------------
  kong-database:
    image: postgres:13
    container_name: kong_db
    environment:
      POSTGRES_USER: kong
      POSTGRES_DB: kong
      POSTGRES_PASSWORD: kongpassword
    ports:
      - '5432:5432'
    volumes:
      - kong_db_data:/var/lib/postgresql/data

  kong-migration:
    image: kong:3.4
    container_name: kong_migration
    command: kong migrations bootstrap
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_PASSWORD: kongpassword
      KONG_PG_USER: kong
    depends_on:
      - kong-database
    restart: on-failure

  kong:
    image: kong:3.4
    container_name: kong_gateway
    restart: always
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_PASSWORD: kongpassword
      KONG_PG_USER: kong
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001, 0.0.0.0:8444 ssl
    ports:
      - '8000:8000' # Cổng Proxy dành cho Client/Frontend gọi vào
      - '8443:8443'
      - '8001:8001' # Cổng Admin API để cấu hình Route/Service
      - '8444:8444'
    depends_on:
      - kong-migration

volumes:
  auth_db_data:
  crypto_db_data:
  kong_db_data: